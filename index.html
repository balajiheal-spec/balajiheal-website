<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balaji Heal | Pharmacy & Healthcare</title>
<meta name="description" content="Balaji Heal - Your trusted pharmacy and healthcare partner. Medicines, surgical items, prescription support and home delivery.">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html{
    scroll-behavior:smooth;
}
body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f6f8fb;
    color:#17212b;
    line-height:1.6;
}
a{
    text-decoration:none;
}
.container{
    width:92%;
    max-width:1180px;
    margin:auto;
}
/* TOP BAR */
.topbar{
    background:#111827;
    color:#fff;
    font-size:13px;
}
.topbar-inner{
    min-height:38px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}
.topbar a{
    color:#fff;
}
/* HEADER */
header{
    background:#fff;
    border-bottom:1px solid #e8edf2;
    position:sticky;
    top:0;
    z-index:1000;
}
.header-inner{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}
.brand{
    display:flex;
    align-items:center;
    gap:12px;
}
.brand-icon{
    width:48px;
    height:48px;
    background:#d71920;
    color:#fff;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:bold;
    box-shadow:0 7px 18px rgba(215,25,32,.22);
}
.brand-name{
    color:#111827;
    font-size:24px;
    font-weight:800;
    letter-spacing:-.5px;
}
.brand-name span{
    color:#d71920;
}
.brand-tagline{
    color:#718096;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}
nav{
    display:flex;
    align-items:center;
    gap:28px;
}
nav a{
    color:#374151;
    font-size:14px;
    font-weight:700;
}
nav a:hover{
    color:#d71920;
}
.nav-button{
    background:#d71920;
    color:#fff !important;
    padding:11px 18px;
    border-radius:7px;
}
/* HERO */
.hero{
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 90% 15%, rgba(215,25,32,.10), transparent 30%),
        linear-gradient(135deg,#fff 0%,#fff8f8 55%,#f8fafc 100%);
    padding:78px 0 72px;
}
.hero-content{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:55px;
}
.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border:1px solid #f1d0d2;
    color:#c5161d;
    padding:8px 13px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    margin-bottom:20px;
}
.hero h1{
    font-size:56px;
    line-height:1.05;
    letter-spacing:-2px;
    color:#111827;
    margin-bottom:18px;
}
.hero h1 span{
    color:#d71920;
}
.hero-text{
    color:#5b6573;
    font-size:18px;
    max-width:610px;
    margin-bottom:28px;
}
